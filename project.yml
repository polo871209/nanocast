name: Nanocast
options:
  bundleIdPrefix: com.nanocast
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # Stable self-signed identity so macOS keeps the Accessibility grant across rebuilds.
    CODE_SIGN_IDENTITY: "Nanocast Self-Signed"
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    NANOCAST_BUNDLE_IDENTIFIER: com.nanocast.app
  configs:
    Debug:
      NANOCAST_BUNDLE_IDENTIFIER: com.nanocast.app.dev
    Release:
      # Release-only: library validation refuses Debug's `.debug.dylib`, whose team never matches.
      ENABLE_HARDENED_RUNTIME: YES
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

targets:
  Nanocast:
    type: application
    platform: macOS
    sources:
      - path: Nanocast
        excludes:
          - Features/Clipboard/Service/ClipboardTextExtractor.swift
          - Features/Clipboard/Service/ClipboardTextHelper.swift
          - Features/Screenshot/Service/ScreenshotTextExtractor.swift
          - Features/FileSearch/Helper
      # The MIT mark's licence asks the notice to travel with the binary, not just the repo.
      - path: NOTICE.md
        buildPhase: resources
    dependencies:
      - target: ClipboardTextHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: FileIndexHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(NANOCAST_BUNDLE_IDENTIFIER)"
        INFOPLIST_FILE: Nanocast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Nanocast/Nanocast.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: nanocast
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          PRODUCT_NAME: Nanocast Dev

  ClipboardTextHelper:
    type: tool
    platform: macOS
    sources:
      - Nanocast/Features/Clipboard/Service/ClipboardTextExtractor.swift
      - Nanocast/Features/Clipboard/Service/ClipboardTextHelper.swift
      - Nanocast/Features/Screenshot/Service/ScreenshotTextExtractor.swift
    settings:
      base:
        EXECUTABLE_NAME: ClipboardTextHelper
        PRODUCT_MODULE_NAME: ClipboardTextHelper
        SKIP_INSTALL: YES

  FileIndexHelper:
    type: tool
    platform: macOS
    sources:
      - Nanocast/Features/FileSearch/Helper/FileIndexHelper.swift
      - Nanocast/Features/FileSearch/Model/FileSearchIgnoreList.swift
      - Nanocast/Features/FileSearch/Model/FileSearchPolicy.swift
      - Nanocast/Features/FileSearch/Model/FileSearchQuery.swift
      - Nanocast/Features/FileSearch/Model/FileSearchResult.swift
      - Nanocast/Features/FileSearch/Model/FileSearchScope.swift
      - Nanocast/Features/FileSearch/Service/FileIndexCrawler.swift
      - Nanocast/Features/FileSearch/Service/FileIndexSnapshot.swift
    settings:
      base:
        # Pinned, or release.yml's PRODUCT_NAME renames the binary FileIndexer looks for.
        EXECUTABLE_NAME: FileIndexHelper
        PRODUCT_MODULE_NAME: FileIndexHelper
        SKIP_INSTALL: YES
        SWIFT_OPTIMIZATION_LEVEL: -O

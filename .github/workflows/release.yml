name: Release

run-name: "Nanocast #${{ github.run_number }}"

on:
  workflow_dispatch:

concurrency:
  group: release

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dmg_sha256: ${{ steps.package.outputs.dmg_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode 27
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 27.x found on this runner. Installed Xcodes:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Compute release metadata
        id: meta
        run: |
          SNAPSHOT="$(git log --first-parent -1 --format=%H --grep='^Rename upstream [0-9a-f]* to Nanocast$')"
          git fetch --quiet --no-tags https://github.com/abue-ammar/tinycast.git '+refs/tags/v*:refs/tags/tinycast/v*'
          TINYCAST_TAG="$(git describe --tags --abbrev=0 --match 'tinycast/v*' "${SNAPSHOT}^")"
          BASE="${TINYCAST_TAG#tinycast/v}"
          BASE="${BASE%%-*}"
          LAST="$(git ls-remote --tags --refs origin "refs/tags/v${BASE}-*" |
            sed -E "s|.*refs/tags/v${BASE}-||" | grep -E '^[0-9]+$' | sort -n | tail -n1 || true)"
          VERSION="${BASE}-$((${LAST:-0} + 1))"
          echo "Tinycast ${TINYCAST_TAG#tinycast/} -> Nanocast ${VERSION}"
          {
            echo "version=${VERSION}"
            echo "dmg_file=Nanocast-${VERSION}.dmg"
            echo "zip_file=Nanocast-${VERSION}.zip"
          } >> "$GITHUB_OUTPUT"

      # Every release is signed with the same certificate, because TCC drops Accessibility on a change.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          echo "${P12_BASE64}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${P12_PASSWORD}" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build app
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -project Nanocast.xcodeproj -scheme Nanocast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Nanocast Self-Signed" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Assert an arm64-only build with a macOS 27.0 floor
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/Nanocast.app"
          PLIST_MIN="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")"
          if [ "$PLIST_MIN" != "27.0" ]; then
            echo "::error::expected LSMinimumSystemVersion 27.0, got $PLIST_MIN"
            exit 1
          fi
          for BIN in "$APP/Contents/MacOS/Nanocast" "$APP/Contents/Helpers/ClipboardTextHelper" "$APP/Contents/Helpers/FileIndexHelper" "$APP/Contents/Helpers/FileToolHelper" "$APP/Contents/Helpers/Nanocast Dictation.app/Contents/MacOS/Nanocast Dictation"; do
            SLICES="$(lipo -archs "$BIN")"
            if [ "$SLICES" != "arm64" ]; then
              echo "::error::${BIN##*/}: expected arm64 alone, got '$SLICES'"
              exit 1
            fi
            MINOS="$(xcrun vtool -show-build-version "$BIN" | awk '/minos/{print $2}')"
            if [ "$MINOS" != "27.0" ]; then
              echo "::error::${BIN##*/}: expected a macOS 27.0 floor, got minos=$MINOS"
              exit 1
            fi
          done

      # Notarization rejects a nested binary without the hardened runtime, and Xcode signs the helper apart.
      - name: Assert the signature is notarizable
        run: ./Scripts/verify-signature.sh "$RUNNER_TEMP/DerivedData/Build/Products/Release/Nanocast.app"

      - name: Package DMG and ZIP
        id: package
        env:
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
          ZIP_FILE: ${{ steps.meta.outputs.zip_file }}
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/Nanocast.app"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          diskutil image create from "$STAGE" --format UDZO --volumeName Nanocast "dist/${DMG_FILE}"
          # `ditto -c -k --keepParent --sequesterRsrc` is the only zip that leaves the code
          # signature verifiable; plain `zip` drops symlinks and breaks the seal.
          ditto -c -k --keepParent --sequesterRsrc "$APP" "dist/${ZIP_FILE}"
          echo "dmg_sha256=$(shasum -a 256 "dist/${DMG_FILE}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: Nanocast-${{ steps.meta.outputs.version }}
          path: dist/

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: v${{ steps.meta.outputs.version }}
          SHA: ${{ github.sha }}
        run: ./Scripts/release-notes.sh "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
          ZIP_FILE: ${{ steps.meta.outputs.zip_file }}
        # --notes-file, never --generate-notes: gh prepends --notes to generated notes, which would
        # put the install boilerplate back above the changelog.
        run: |
          gh release create "v${VERSION}" "dist/${DMG_FILE}" "dist/${ZIP_FILE}" \
            --title "Nanocast ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md"

  cask:
    needs: build
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      SHA256: ${{ needs.build.outputs.dmg_sha256 }}
      BRANCH: ${{ github.event.repository.default_branch }}
      # brew audit --online calls the GitHub API; unauthenticated, a shared runner IP hits the 60/hour limit.
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Point the cask at the release
        run: |
          sed -i '' -E \
            -e "s|^  version \".*\"$|  version \"${VERSION}\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"${SHA256}\"|" \
            Casks/nanocast.rb
          grep -qx "  version \"${VERSION}\"" Casks/nanocast.rb
          grep -qx "  sha256 \"${SHA256}\"" Casks/nanocast.rb

      - name: Audit the cask and download the published DMG
        run: |
          ./Scripts/link-tap.sh
          brew style Casks/nanocast.rb
          brew audit --cask --strict --online polo871209/nanocast/nanocast
          brew fetch --cask --force polo871209/nanocast/nanocast

      - name: Commit the cask bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Casks/nanocast.rb; then
            echo "Casks/nanocast.rb already points at ${VERSION}."
            exit 0
          fi
          git commit -m "nanocast ${VERSION}" Casks/nanocast.rb
          for _ in 1 2 3; do
            git push origin "HEAD:${BRANCH}" && exit 0
            git pull --rebase origin "$BRANCH"
          done
          exit 1

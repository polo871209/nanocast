included:
  - Nanocast
  - Tests

excluded:
  - Nanocast/DesignSystem/Scrolling/EdgeDissolve.swift
  - Nanocast/DesignSystem/Scrolling/ThinScrollbar.swift
  - "**/*.generated.swift"

disabled_rules:
  - todo                                      # tracked in issues, not by the linter
  - trailing_whitespace                       # cosmetic, and nothing auto-fixes it on save
  - identifier_name                           # rejects `id`, `dx`, `x` — all correct here
  - type_body_length                          # a SwiftUI view is legitimately long
  - function_body_length
  - file_length                               # RootPaletteView is long by design
  - cyclomatic_complexity                     # a switch over AppEntry.Kind is not complex
  - nesting                                   # namespace enums are the house style
  - large_tuple
  - function_parameter_count                  # SwiftUI initialisers
  - multiple_closures_with_trailing_closure   # fights SwiftUI
  - opening_brace                             # swift-format owns brace placement
  - trailing_comma                            # swift-format owns trailing commas
  # `count` is a hit count on LauncherRankingRecord and PaletteRowIndex, not a collection count.
  # This rule rewrites `count == 0` to `isEmpty` on both, which does not compile.
  - empty_count
  - optional_data_string_conversion          # repairing `String(decoding:as:)` is intended; the fix returns nil

opt_in_rules:
  - first_where
  - last_where
  - contains_over_filter_count
  - contains_over_first_not_nil
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - toggle_bool
  - static_over_final_class
  - unneeded_parentheses_in_closure_argument
  - weak_delegate

force_try: error
force_cast: warning

type_name:
  min_length: 2

line_length:
  warning: 130
  ignores_urls: true
  ignores_comments: false
